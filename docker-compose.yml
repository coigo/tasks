services:
  postgres:
    image: postgres:16
    container_name: tasks_postgres
    restart: always
    environment:
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
      POSTGRES_DB: tasks
    ports:
      - 5433:5432
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: tasks_minio
    restart: always
    environment:
      MINIO_ROOT_USER: tasks
      MINIO_ROOT_PASSWORD: taskstasks
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"

volumes:
  pgdata:
  miniodata: