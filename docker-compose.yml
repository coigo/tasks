services:
  postgres:
    image: postgres:16
    container_name: tasks_postgres
    restart: on-failure
    environment:
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
      POSTGRES_DB: tasks
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: tasks_minio
    restart: on-failure
    environment:
      MINIO_ROOT_USER: tasks
      MINIO_ROOT_PASSWORD: taskstasks
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata: